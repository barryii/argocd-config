apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: a5020877/docker-fastapi:a3d2ab92ec02ddccd71d75866161e3b62b51c993
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
