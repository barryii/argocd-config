apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: a5020877/docker-fastapi:1c85e0db28bf5c5e1b0ebf20a0deeba72db5e654
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
